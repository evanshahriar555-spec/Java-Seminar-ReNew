<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Chart')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><h1>Catalogue insights</h1><p>Number of notebook models by manufacturer.</p><div class="panel"><canvas id="chart"></canvas></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script><script th:inline="javascript">const labels=/*[[${labels}]]*/ [];const values=/*[[${values}]]*/ [];new Chart(document.getElementById('chart'),{type:'bar',data:{labels:labels,datasets:[{label:'Models',data:values,backgroundColor:'#26877c'}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});</script></main><footer th:replace="~{menu :: footer}"></footer></body></html>
