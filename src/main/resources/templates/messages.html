<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Messages')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><h1>Contact messages</h1><p>Newest first. Registered users only.</p><div th:each="m : ${messages}" class="panel mb-3"><strong th:text="${m.name}"></strong> · <span th:text="${m.email}"></span><p class="small text-muted" th:text="${m.sentAt}"></p><p class="message" th:text="${m.message}"></p></div><p th:if="${#lists.isEmpty(messages)}">No messages yet.</p></main><footer th:replace="~{menu :: footer}"></footer></body></html>
