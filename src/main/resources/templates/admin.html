<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('CRUD')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><h1>Inventory management</h1><p>Administrator only.</p><a class="btn btn-primary mb-4" th:href="@{/admin/new}">Add notebook</a><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Brand / model</th><th>Processor</th><th>OS</th><th>Display</th><th>RAM / disk (MB / GB)</th><th>Graphics</th><th>Price (£)</th><th>Stock</th><th>Actions</th></tr></thead><tbody><tr th:each="n : ${notebooks}"><td th:text="${n.id}"></td><td><strong th:text="${n.manufacturer}"></strong><br><span th:text="${n.type}"></span></td><td th:text="${n.processor.manufacturer+' '+n.processor.type}"></td><td th:text="${n.opsystem.osname}"></td><td th:text="${n.display}"></td><td th:text="${n.memory+' / '+n.harddisk}"></td><td th:text="${n.videocontroller}"></td><td th:text="${n.price}"></td><td th:text="${n.pieces}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/{id}/edit(id=${n.id})}">Edit</a><form class="mt-2" th:action="@{/admin/{id}/delete(id=${n.id})}" method="post" onsubmit="return confirm('Delete this notebook?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></div></main><footer th:replace="~{menu :: footer}"></footer></body></html>
