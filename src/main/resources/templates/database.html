<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Database')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><h1>Notebook catalogue</h1><p>Notebook, processor and operating system — joined using JPA relationships.</p><form class="d-flex gap-2 mb-4" th:action="@{/database}" method="get"><input class="form-control" name="q" placeholder="Search brand, model, processor or OS" th:value="${q}"><button class="btn btn-primary">Search</button></form><p th:text="${#lists.size(notebooks)}+' results'"></p><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Brand / model</th><th>Processor</th><th>OS</th><th>Display</th><th>RAM / disk (MB / GB)</th><th>Graphics</th><th>Price (£)</th><th>Stock</th></tr></thead><tbody><tr th:each="n : ${notebooks}"><td th:text="${n.id}"></td><td><strong th:text="${n.manufacturer}"></strong><br><span th:text="${n.type}"></span></td><td th:text="${n.processor.manufacturer+' '+n.processor.type}"></td><td th:text="${n.opsystem.osname}"></td><td th:text="${n.display}"></td><td th:text="${n.memory+' / '+n.harddisk}"></td><td th:text="${n.videocontroller}"></td><td th:text="${n.price}"></td><td th:text="${n.pieces}"></td></tr></tbody></table></div></main><footer th:replace="~{menu :: footer}"></footer></body></html>
