<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Contact')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><div class="form-panel"><h1>Contact us</h1><div th:if="${param.sent}" class="alert alert-success">Message saved successfully.</div><form th:action="@{/contact}" th:object="${contactForm}" method="post"><label>Name<input class="form-control" th:field="*{name}" maxlength="100" required></label><p class="text-danger" th:errors="*{name}"></p><label>Email<input class="form-control" type="email" th:field="*{email}" maxlength="254" required></label><p class="text-danger" th:errors="*{email}"></p><label>Message<textarea class="form-control" th:field="*{message}" rows="5" maxlength="2000" required></textarea></label><p class="text-danger" th:errors="*{message}"></p><p class="small">Messages and email addresses are visible to registered users in this course demonstration. Use fictional contact details.</p><button class="btn btn-primary">Send message</button></form></div></main><footer th:replace="~{menu :: footer}"></footer></body></html>
