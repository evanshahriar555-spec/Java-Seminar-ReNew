<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Edit')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><div class="form-panel"><h1 th:text="${editId == null ? 'Add notebook' : 'Edit notebook'}"></h1><form th:action="${editId == null} ? @{/admin/new} : @{/admin/{id}/edit(id=${editId})}" th:object="${notebookForm}" method="post"><div th:each="e : ${#fields.globalErrors()}" class="text-danger" th:text="${e}"></div><label>Manufacturer<input class="form-control" type="text" th:field="*{manufacturer}" required></label><p class="text-danger" th:errors="*{manufacturer}"></p><label>Model<input class="form-control" type="text" th:field="*{type}" required></label><p class="text-danger" th:errors="*{type}"></p><label>Display inches<input class="form-control" type="number" th:field="*{display}" step="0.1" required></label><p class="text-danger" th:errors="*{display}"></p><label>Memory (MB)<input class="form-control" type="number" th:field="*{memory}" required></label><p class="text-danger" th:errors="*{memory}"></p><label>Disk (GB)<input class="form-control" type="number" th:field="*{harddisk}" required></label><p class="text-danger" th:errors="*{harddisk}"></p><label>Graphics<input class="form-control" type="text" th:field="*{videocontroller}" required></label><p class="text-danger" th:errors="*{videocontroller}"></p><label>Price (£)<input class="form-control" type="number" th:field="*{price}" required></label><p class="text-danger" th:errors="*{price}"></p><label>Stock<input class="form-control" type="number" th:field="*{pieces}" required></label><p class="text-danger" th:errors="*{pieces}"></p><label>Processor<select class="form-select" th:field="*{processorid}"><option th:each="p : ${processors}" th:value="${p.id}" th:text="${p.manufacturer+' '+p.type}"></option></select></label><p class="text-danger" th:errors="*{processorid}"></p><label>Operating system<select class="form-select" th:field="*{opsystemid}"><option th:each="s : ${systems}" th:value="${s.id}" th:text="${s.osname}"></option></select></label><p class="text-danger" th:errors="*{opsystemid}"></p><button class="btn btn-primary">Save</button><a class="btn btn-link" th:href="@{/admin}">Cancel</a></form></div></main><footer th:replace="~{menu :: footer}"></footer></body></html>
