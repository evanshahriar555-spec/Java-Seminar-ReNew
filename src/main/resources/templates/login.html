<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{menu :: head('Login')}"></head><body><nav th:replace="~{menu :: menu}"></nav><main class="container py-5"><div class="form-panel"><h1>Login</h1><div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in.</div><div class="alert alert-danger" th:if="${param.error}">Incorrect username or password.</div><form th:action="@{/login}" method="post"><label>Username<input class="form-control mb-3" name="username" required></label><label>Password<input class="form-control mb-3" type="password" name="password" required></label><button class="btn btn-primary">Login</button></form></div></main><footer th:replace="~{menu :: footer}"></footer></body></html>
